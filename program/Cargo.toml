[package]
name = "spl-token-group-example"
version = "0.2.1"
description = "Solana Program Library Token Group Example"
documentation = "https://docs.rs/spl-token-group-example"
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[features]
no-entrypoint = []
test-sbf = []

[dependencies]
solana-program = { git = "https://github.com/jupnet/jupnet-sdk" }
solana-program-error = { git = "https://github.com/jupnet/jupnet-sdk" }
solana-system-interface = { git = "https://github.com/jupnet/jupnet-sdk" }
spl-pod = { git = "https://github.com/jupnet/libraries", branch = "jupnet" }
# spl-token-2022 = { version = "9.0.0", features = ["no-entrypoint"] }
spl-token-group-interface = { path = "../interface" }
spl-type-length-value = { git = "https://github.com/jupnet/libraries", branch = "jupnet" }

[dev-dependencies]
solana-program-test = "2.3.4"
solana-sdk = "2.2.1"
spl-discriminator = "0.5.1"
spl-token-client = "0.16.1"
spl-token-metadata-interface = "0.8.0"

[lib]
crate-type = ["cdylib", "lib"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
